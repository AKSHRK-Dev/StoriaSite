# Storia website. Installed as /etc/nginx/sites-available/storia by deploy.sh.
#
# "/" (and paths without a language, like /docs/...) are sent to /en-us/ or /ja-jp/:
#   1. the language the visitor picked in the header (cookie storia_lang), else
#   2. Cloudflare's CF-IPCountry header: JP -> ja-jp, else
#   3. en-us.

map $cookie_storia_lang $storia_lang_cookie {
    "ja-jp" ja-jp;
    "en-us" en-us;
    default "";
}
map $http_cf_ipcountry $storia_lang_geo {
    JP      ja-jp;
    default en-us;
}
map $storia_lang_cookie $storia_lang {
    ""      $storia_lang_geo;
    default $storia_lang_cookie;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/storia;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        add_header Cache-Control "no-store" always;
        add_header Vary "Cookie, CF-IPCountry" always;
        return 302 /$storia_lang/;
    }

    # Paths without a language prefix.
    location ~ ^/(downloads|docs)(/.*)?$ {
        add_header Cache-Control "no-store" always;
        return 302 /$storia_lang/$1$2;
    }
    location ~ ^/(ja|jp|ja-JP|ja_jp)/?$ { return 301 /ja-jp/; }
    location ~ ^/(en|us|en-US|en_us)/?$ { return 301 /en-us/; }

    location /en-us/ {
        try_files $uri $uri/ =404;
        error_page 404 /en-us/404.html;
    }
    location /ja-jp/ {
        try_files $uri $uri/ =404;
        error_page 404 /ja-jp/404.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public" always;
    }

    location / {
        try_files $uri =404;
        error_page 404 /en-us/404.html;
    }
}
